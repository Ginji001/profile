    unofficial: true
  - emoji: "🧪"
    name: { ja: "化粧品成分検定1級 学習ノート", en: "Cosmetic Ingredient Exam Lv.1 Study Notes" }
    description: { ja: "成分のまとめ、問題演習の記録と正答率、直前暗記カードをまとめた受験勉強用のPWA。", en: "A study PWA with ingredient notes, practice-question records and accuracy, and last-minute flashcards." }
    tags: [PWA]
    live: true
    app: "https://ginji001.github.io/seibun-kentei-note/"
    code: "https://github.com/Ginji001/seibun-kentei-note"
    unofficial: true
  - emoji: "🐾"
    name: { ja: "ハチワレ手帳", en: "Hachiware Notebook" }
    description: { ja: "デイリー、マンスリー、INBOX、習慣、コレクション、ほしい物リストをまとめた手帳PWA。ログイン不要で、写真も含めてデータは端末の中だけ。", en: "A notebook PWA with daily and monthly pages, an inbox, habits, collections, and a wishlist. No login; data, including photos, stays on your device." }
