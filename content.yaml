# 作ったもの欄の最後に出るGitHub案内です。URLと表示文を編集できます。
otherRepositories:
  text: { ja: "ほかのリポジトリは", en: "ほかのリポジトリは" }
  label: { ja: "GitHub", en: "GitHub" }
