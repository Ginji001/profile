    description: { ja: "学習計画、問題ごとの記録と正答率、間違いノート、直前暗記カードをまとめた受験勉強用のPWA。", en: "A study PWA for the exam: study plan, per-question records and accuracy, a mistakes notebook, and last-minute flashcards." }
