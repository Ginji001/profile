# 草を取り直して GitHub Pages に公開する（毎日 0:17 JST と、main に push したとき）
name: Update and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 草を取得
        run: node scripts/contributions.mjs site/contributions.json
      # 毎日コミットして、60日間動きがないと定期実行が止まる仕様を避ける
      - name: 変わっていたら保存
        run: |
          if [ -n "$(git status --porcelain site/contributions.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/contributions.json
            git commit -m "草を更新"
            git push
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
